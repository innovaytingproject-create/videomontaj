<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="vendor/fonts.css" />
    <style>
      :root {
        --ink: #17130f;
        --orange: #ff6b1a;
        --orange-deep: #e05600;
        --peach: #ffd9bd;
        --cream: #fff6ee;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; font-family: "Golos Text", sans-serif; }

      /* ---------- footage ---------- */
      .vidwrap { position: absolute; inset: 0; overflow: hidden; }
      .vidzoom { width: 100%; height: 100%; }
      #aroll { width: 100%; height: 100%; object-fit: cover; display: block; }
      .scrim { position: absolute; left: 0; right: 0; top: 1150px; bottom: 0; pointer-events: none;
               background: linear-gradient(180deg, rgba(23,19,15,0) 0%, rgba(23,19,15,.42) 60%, rgba(23,19,15,.55) 100%); }

      /* ---------- intro card ---------- */
      .intro { position: absolute; inset: 0; }
      .intro-in { position: absolute; inset: 0; background:
        radial-gradient(1100px 1100px at 78% 18%, #ffe3cc 0%, rgba(255,227,204,0) 60%),
        radial-gradient(900px 900px at 12% 86%, #ffe8d6 0%, rgba(255,232,214,0) 55%), var(--cream); }
      .blob { position: absolute; width: 760px; height: 760px; right: -240px; top: 180px; border-radius: 50%;
              background: radial-gradient(circle at 35% 35%, #ffb27a, var(--orange)); filter: blur(70px); opacity: .5; }
      .blob2 { position: absolute; width: 420px; height: 420px; left: -160px; bottom: 120px; border-radius: 50%;
               background: #ffcba3; filter: blur(60px); opacity: .55; }
      .intro-pill { position: absolute; top: 176px; left: 0; right: 0; display: flex; justify-content: center; }
      .pillin b { color: var(--orange-deep); }
      .pillin { background: #fff; border-radius: 60px; padding: 20px 52px; box-shadow: 0 14px 40px rgba(255,107,26,.18);
                font-weight: 800; font-size: 34px; letter-spacing: .2em; color: var(--ink); white-space: nowrap; }
      .intro-pill b { color: var(--orange-deep); }
      .photo { position: absolute; top: 560px; left: 50%; margin-left: -310px; width: 620px; }
      .photo-r { transform: rotate(-6deg); }
      .photo img { display: block; width: 620px; height: 620px; object-fit: cover; border-radius: 44px;
                   box-shadow: 0 50px 90px rgba(23,19,15,.26), 0 10px 26px rgba(23,19,15,.14); border: 10px solid #fff; }
      .script { font-family: "Caveat", cursive; font-weight: 700; color: var(--orange-deep); }
      .intro-script { position: absolute; top: 1252px; left: 0; right: 0; text-align: center; font-size: 128px; }
      .intro-script .rot { display: inline-block; transform: rotate(-3deg); }
      .intro-head { position: absolute; top: 1392px; left: 0; right: 0; display: flex; justify-content: center; }
      .mask { overflow: hidden; padding: 10px 26px 18px; }
      .intro-head h1 { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 96px; color: var(--ink); letter-spacing: 0; }
      .star { position: absolute; background: var(--orange);
              clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
      .st1 { width: 72px; height: 72px; left: 136px; top: 470px; }
      .st2 { width: 46px; height: 46px; right: 150px; top: 1210px; background: var(--ink); }
      .st3 { width: 100px; height: 100px; right: 108px; top: 560px; background: #fff; }
      .st4 { width: 54px; height: 54px; left: 170px; bottom: 300px; background: #fff; }

      /* ---------- captions ---------- */
      .cap { position: absolute; left: 70px; right: 70px; bottom: 560px; display: flex; justify-content: center; }
      .cap-card { max-width: 880px; background: rgba(255,255,255,.96); border-radius: 32px; padding: 26px 42px 30px;
                  box-shadow: 0 16px 44px rgba(23,19,15,.22); text-align: center;
                  font-weight: 800; font-size: 48px; line-height: 1.18; color: var(--ink); }
      .w { display: inline-block; }
      .hot { color: var(--orange-deep); }

      /* ---------- brand pill over footage ---------- */
      .brand { position: absolute; top: 150px; left: 60px; }
      .brand-in { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,.95); border-radius: 60px;
                  padding: 16px 32px; box-shadow: 0 12px 34px rgba(23,19,15,.2); }
      .brand-in b { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 32px; color: var(--orange-deep); letter-spacing: .06em; }
      .brand-in i { width: 4px; height: 30px; background: var(--peach); display: block; }
      .brand-in span { font-weight: 800; font-size: 30px; color: var(--ink); font-style: normal; }

      /* ---------- mo'jiza moment ---------- */
      .mojiza { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; }
      .mj-script { font-size: 108px; display: block; }
      .mj-script .rot { display: inline-block; transform: rotate(-3deg); }
      .mj-word { display: inline-block; margin-top: 4px; background: var(--ink); color: #fff; border-radius: 30px;
                 padding: 18px 44px 26px; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 104px;
                 box-shadow: 0 20px 50px rgba(23,19,15,.35); }
      .mj-word em { font-style: normal; color: var(--orange); }
      .ring { position: absolute; left: 50%; top: 56%; width: 300px; height: 300px; margin: -150px 0 0 -150px;
              border: 14px solid var(--orange); border-radius: 50%; }
      .mjs1 { width: 64px; height: 64px; left: 190px; top: -30px; background: #fff; }
      .mjs2 { width: 88px; height: 88px; right: 160px; top: 40px; }

      /* ---------- end sting ---------- */
      .endcard { position: absolute; inset: 0; }
      .end-bg { position: absolute; inset: 0; background: radial-gradient(1000px 1400px at 50% 30%, #ef6511 0%, #e05600 55%, #c74c02 100%); }
      .end-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 150px; }
      .end-script { font-size: 120px; color: #fff; }
      .end-script .rot { display: inline-block; transform: rotate(-3deg); }
      .end-logo-mask { overflow: hidden; padding: 8px 20px 16px; }
      .end-logo { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 140px; color: #fff; }
      .end-sub { margin-top: 10px; background: rgba(23,19,15,.92); color: #fff; border-radius: 50px; padding: 18px 40px 22px;
                 font-weight: 800; font-size: 40px; }
      .end-sub em { font-style: normal; color: #ffb27a; }
      .est1 { width: 80px; height: 80px; left: 180px; top: 520px; background: #fff; }
      .est2 { width: 52px; height: 52px; right: 210px; top: 640px; background: var(--ink); }
      .est3 { width: 64px; height: 64px; right: 170px; bottom: 460px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.4" data-width="1080" data-height="1920">

      <div id="vid" class="vidwrap">
        <div class="vidzoom" id="vz">
          <video id="aroll" class="clip" src="assets/cut15.mp4" playsinline muted data-start="0" data-duration="13.2" data-track-index="0"></video>
        </div>
        <div class="scrim"></div>
      </div>

      <div id="intro" class="clip intro" data-start="0" data-duration="2.55" data-track-index="3">
        <div class="intro-in" id="introin">
          <div class="blob"></div><div class="blob2"></div>
          <i class="star st1"></i><i class="star st2"></i><i class="star st3"></i><i class="star st4"></i>
          <div class="intro-pill"><span class="pillin"><b>FOHERB</b>&nbsp;·&nbsp;BIOMASSAJYOR</span></div>
          <div class="photo" id="photo"><div class="photo-r"><img src="assets/product.jpg" alt="" /></div></div>
          <div class="intro-script script"><span class="rot" id="iscript">Massajni</span></div>
          <div class="intro-head"><div class="mask"><h1 id="ihead">SEVASIZMI?</h1></div></div>
        </div>
      </div>

      <div id="brand" class="clip brand" data-start="3.1" data-duration="10.1" data-track-index="2">
        <div class="brand-in"><b>FOHERB</b><i></i><span>Biomassajyor</span></div>
      </div>

      <div id="cap1" class="clip cap" data-start="2.95" data-duration="2.15" data-track-index="4">
        <p class="cap-card"><span class="w">Men</span> <span class="w">massajni</span> <span class="w hot">juda</span> <span class="w hot">sevaman</span></p>
      </div>
      <div id="cap2" class="clip cap" data-start="5.15" data-duration="3.3" data-track-index="4">
        <p class="cap-card"><span class="w">Shuning</span> <span class="w">uchun</span> <span class="w">assotsiatsiyada</span> <span class="w">o&#8217;zimga</span></p>
      </div>
      <div id="cap3" class="clip cap" data-start="8.5" data-duration="2.6" data-track-index="4">
        <p class="cap-card"><span class="w hot">biomassajyor</span> <span class="w">xarid</span> <span class="w">qildim</span></p>
      </div>

      <div id="mojiza" class="clip mojiza" data-start="11.3" data-duration="1.78" data-track-index="4">
        <i class="ring" id="ring"></i>
        <i class="star mjs1"></i><i class="star mjs2"></i>
        <span class="mj-script script"><span class="rot">bu shunchaki</span></span>
        <span class="mj-word" id="mjword">MO&#8217;JIZA<em>!</em></span>
      </div>

      <div id="end" class="clip endcard" data-start="13.0" data-duration="2.4" data-track-index="5">
        <div class="end-bg" id="endbg"></div>
        <i class="star est1"></i><i class="star est2"></i><i class="star est3"></i>
        <div class="end-in">
          <div class="end-script script"><span class="rot" id="escript">Tavsiya qilaman!</span></div>
          <div class="end-logo-mask"><div class="end-logo" id="elogo">FOHERB</div></div>
          <div class="end-sub" id="esub">Biomassajyor&nbsp;·&nbsp;<em>5 funksiya</em></div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ---- intro: pops, float, zoom-blur exit ---- */
      tl.fromTo("#photo", { y: 110, opacity: 0, scale: .72 }, { y: 0, opacity: 1, scale: 1, duration: .55, ease: "back.out(1.9)" }, 0.05);
      tl.to("#photo", { y: -16, duration: 1.6, ease: "sine.inOut" }, 0.65);
      tl.fromTo(".intro-pill", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: "power3.out" }, 0.12);
      tl.fromTo(".intro-script", { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(2.4)" }, 0.42);
      tl.fromTo("#ihead", { yPercent: 115 }, { yPercent: 0, duration: .55, ease: "expo.out" }, 0.58);
      tl.fromTo(".intro .star", { scale: 0, rotation: -80 }, { scale: 1, rotation: 0, duration: .5, ease: "back.out(2.6)", stagger: .07 }, 0.3);
      tl.to(".intro .star", { rotation: 70, duration: 1.5, ease: "none" }, 0.85);
      tl.fromTo(".blob", { scale: .9 }, { scale: 1.08, duration: 2.2, ease: "sine.inOut" }, 0);
      /* zoom-blur out */
      tl.fromTo("#introin", { scale: 1, filter: "blur(0px)", opacity: 1 }, { scale: 1.55, filter: "blur(28px)", opacity: 0, duration: .4, ease: "power3.in" }, 2.12);

      /* ---- footage: blur-in + living camera + punch on mo'jiza ---- */
      tl.fromTo("#vz", { scale: 1.3, filter: "blur(18px)" }, { scale: 1.05, filter: "blur(0px)", duration: .55, ease: "power3.out" }, 2.22);
      tl.to("#vz", { scale: 1.1, duration: 8.4, ease: "sine.inOut" }, 2.85);
      tl.to("#vz", { scale: 1.18, duration: .32, ease: "expo.out" }, 11.3);

      /* ---- captions: word pops ---- */
      for (const [id, t] of [["cap1", 2.95], ["cap2", 5.15], ["cap3", 8.5]]) {
        tl.fromTo("#" + id + " .cap-card", { y: 60, opacity: 0, scale: .92 }, { y: 0, opacity: 1, scale: 1, duration: .38, ease: "back.out(2)" }, t);
        tl.fromTo("#" + id + " .w", { yPercent: 55, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .25, ease: "power3.out", stagger: .05 }, t + .06);
      }
      tl.to("#cap1 .cap-card", { y: 40, opacity: 0, duration: .22, ease: "power2.in" }, 4.86);
      tl.to("#cap2 .cap-card", { y: 40, opacity: 0, duration: .22, ease: "power2.in" }, 8.21);
      tl.to("#cap3 .cap-card", { y: 40, opacity: 0, duration: .2, ease: "power2.in" }, 10.86);

      /* ---- brand pill ---- */
      tl.fromTo("#brand .brand-in", { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: .5, ease: "expo.out" }, 3.1);
      tl.to("#brand .brand-in", { x: -70, opacity: 0, duration: .3, ease: "power2.in" }, 12.85);

      /* ---- mo'jiza pop ---- */
      tl.fromTo("#mojiza .mj-script", { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: "back.out(2.2)" }, 11.32);
      tl.fromTo("#mjword", { scale: .3, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, rotation: -2, duration: .5, ease: "back.out(2.4)" }, 11.46);
      tl.fromTo("#ring", { scale: .3, opacity: .9 }, { scale: 2.6, opacity: 0, duration: .7, ease: "power2.out" }, 11.42);
      tl.fromTo("#mojiza .star", { scale: 0, rotation: -70 }, { scale: 1, rotation: 20, duration: .5, ease: "back.out(2.8)", stagger: .08 }, 11.55);
      tl.to("#mojiza .mj-script, #mjword, #mojiza .star", { scale: .86, opacity: 0, duration: .22, ease: "power2.in" }, 12.82);

      /* ---- end sting: circle wipe + masked logo ---- */
      tl.fromTo("#endbg", { clipPath: "circle(0% at 50% 62%)" }, { clipPath: "circle(120% at 50% 62%)", duration: .5, ease: "expo.inOut" }, 13.0);
      tl.fromTo(".end-script", { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .45, ease: "back.out(2.2)" }, 13.42);
      tl.fromTo("#elogo", { yPercent: 115 }, { yPercent: 0, duration: .5, ease: "expo.out" }, 13.6);
      tl.fromTo("#esub", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: .4, ease: "power3.out" }, 13.85);
      tl.fromTo(".endcard .star", { scale: 0, rotation: -60 }, { scale: 1, rotation: 15, duration: .5, ease: "back.out(2.6)", stagger: .09 }, 13.7);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
