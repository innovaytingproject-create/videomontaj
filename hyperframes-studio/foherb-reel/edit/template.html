    <style>
      :root {
        --ink: #141210;
        --orange: #ff6b1a;
        --orange-soft: #ffb27a;
        --cream: #fff4ea;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; font-family: "Montserrat", sans-serif; }
      #aroll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .scrim {
        position: absolute; left: 0; right: 0; top: 1060px; height: 620px; pointer-events: none;
        background: linear-gradient(180deg, rgba(20,18,16,0) 0%, rgba(20,18,16,.38) 55%, rgba(20,18,16,.5) 100%);
      }

      /* Subtitles: above the bottom 20% platform UI zone. */
      .cap { position: absolute; left: 70px; right: 70px; bottom: 410px; display: flex; justify-content: center; }
      .cap-in {
        max-width: 900px; text-align: center; font-weight: 900; font-size: 60px; line-height: 1.12;
        color: var(--cream); -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill;
        text-shadow: 0 6px 24px rgba(0,0,0,.45);
      }
      .w { display: inline-block; }
      .hot { color: var(--orange); }

      /* Kinetic titles (hook / CTA) sit in the lower-middle so the face stays clear. */
      .title { position: absolute; left: 70px; right: 70px; top: 1060px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
      .slab { display: block; overflow: hidden; padding: 6px 30px 10px; transform-origin: left center; }
      .slab span { display: block; font-weight: 900; font-size: 132px; line-height: 1; text-transform: uppercase; letter-spacing: -0.02em; }
      .slab.dark { background: var(--ink); color: var(--cream); }
      .slab.orange { background: var(--orange); color: var(--ink); margin-left: 60px; }
      .slab.small span { font-size: 72px; }
      .cta .slab span { font-size: 84px; }
      .miracle {
        position: relative; display: block; font-weight: 900; font-size: 250px; line-height: .95; text-transform: uppercase;
        color: var(--orange); -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; margin-left: 40px;
      }
      .spark {
        position: absolute; display: block; background: var(--cream);
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      }
      .s1 { width: 90px; height: 90px; left: -60px; top: -30px; }
      .s2 { width: 120px; height: 120px; right: -110px; top: -40px; background: var(--orange); }
      .s3 { width: 60px; height: 60px; right: -40px; bottom: 10px; }

      /* Product tag and numbered block chips. */
      .tag { position: absolute; left: 60px; top: 1190px; }
      .tag-in { display: flex; align-items: center; gap: 22px; background: var(--ink); color: var(--cream); border-radius: 60px; padding: 20px 36px; font-weight: 700; font-size: 44px; }
      .logo { color: var(--orange); font-weight: 900; letter-spacing: .12em; }
      .tag-sep { display: block; width: 4px; height: 40px; background: var(--orange); }
      .chip { position: absolute; left: 0; top: 1220px; }

      .chip-in b { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 20px; background: var(--orange); color: var(--ink); font-family: "Oswald", sans-serif; font-weight: 700; font-size: 46px; }
      .chip-in span { color: var(--cream); font-weight: 900; font-size: 46px; text-transform: uppercase; letter-spacing: .01em; }

      /* Big number moments. */
      .five { position: absolute; left: 60px; top: 780px; display: flex; }
      .five-in { display: flex; flex-direction: column; align-items: flex-start; }
      .five-n { display: block; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 400px; line-height: .9; color: var(--orange); -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; }
      .five-l { display: block; background: var(--ink); color: var(--cream); font-weight: 900; font-size: 76px; text-transform: uppercase; padding: 8px 30px 12px; }
      .fn { position: absolute; left: 60px; }
      .fn0 { top: 860px; } .fn1 { top: 990px; } .fn2 { top: 1120px; }
      .fn-in { display: flex; align-items: center; gap: 20px; background: var(--cream); color: var(--ink); border-radius: 60px; padding: 20px 38px; font-weight: 900; font-size: 48px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
      .fn-in i { display: block; width: 26px; height: 26px; border-radius: 50%; background: var(--orange); }
      .stat { position: absolute; left: 60px; right: 60px; top: 990px; }
      .stat-in { background: rgba(20,18,16,.94); border-radius: 48px; padding: 40px 50px 56px; display: flex; flex-direction: column; align-items: center; }
      .stat-row { display: flex; align-items: center; gap: 40px; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 240px; line-height: 1.25; }
      .stat-1 { display: block; color: var(--cream); }
      .stat-eq { display: block; color: var(--orange); font-size: 180px; }
      .stat-10 { display: block; color: var(--orange); min-width: 290px; text-align: center; }
      .stat-l1 { color: var(--cream); font-weight: 900; font-size: 60px; text-transform: uppercase; margin-top: 24px; }
      .stat-l2 { color: var(--orange-soft); font-weight: 700; font-size: 46px; margin-top: 6px; }

      /* End card. */
      .endcard { position: absolute; inset: 0; }
      .end-bg { position: absolute; inset: 0; background: radial-gradient(900px 900px at 50% 46%, #3a2213 0%, var(--ink) 62%); }
      .end-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding-bottom: 120px; }
      .end-rec { color: var(--cream); font-weight: 900; font-size: 100px; text-transform: uppercase; }
      .end-logo { color: var(--orange); font-weight: 900; font-size: 160px; letter-spacing: .14em; margin-right: -.14em; }
      .end-line { width: 260px; height: 10px; background: var(--orange); transform-origin: center; }
      .end-sub { color: var(--cream); font-weight: 700; font-size: 44px; opacity: .85; }
    </style>
  </head>
